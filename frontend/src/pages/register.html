<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/src/assets/fav.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daftar — Smart Disaster Risk Prediction System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="/src/styles/main.css" />
    </head>
    <body>
        <div class="ambient">
            <div class="amb c1"></div>
            <div class="amb c2"></div>
            <div class="amb c3"></div>
        </div>

        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-brand">
                    <div class="auth-brand-icon">
                        <img src="/src/assets/login.svg" alt="Logo" />
                    </div>

                    <div class="auth-brand-name">
                        Smart Disaster Risk Prediction System
                    </div>
                </div>

                <p class="auth-subtitle">
                    Buat akun untuk mulai memantau risiko bencana
                </p>

                <div class="alert alert-error" id="err-msg"></div>
                <div class="alert alert-success" id="suc-msg"></div>

                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="name" placeholder="Nama kamu" autocomplete="name" />
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="kamu@email.com" autocomplete="email" />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Min. 6 karakter" autocomplete="new-password" />
                </div>

                <button class="btn-primary" id="btn-register">
                    ✨
                    <span id="reg-label">Buat Akun</span>
                </button>

                <div class="auth-divider">— atau —</div>

                <div class="auth-footer">
                    Sudah punya akun?
                    <a href="/src/pages/login.html">Masuk</a>
                </div>
            </div>
        </div>

        <script type="module" src="/src/pages/js/register.js"></script>
    </body>
</html>
